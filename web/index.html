<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine Chat</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2>Sessions</h2>
                <button id="sidebar-close-btn" class="sidebar-toggle" aria-label="Close sidebar">‹</button>
            </div>
            <div id="session-list" class="session-list">
                <div class="sidebar-loading">Loading sessions...</div>
            </div>
        </aside>
        <main id="main-content">
            <header>
                <button id="sidebar-toggle-btn" class="sidebar-toggle" aria-label="Open sidebar">☰</button>
                <h1>Engine</h1>
                <button id="new-chat-btn">New Chat</button>
            </header>
            <div id="messages">
                <div class="empty-state">Send a message to start</div>
            </div>
            <div class="input-area">
                <textarea id="chat-input" placeholder="Send a message..." rows="1"></textarea>
                <button id="send-btn">Send</button>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="parts.js"></script>
    <script src="app.js"></script>
</body>
</html>
