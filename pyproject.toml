[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "engine"
version = "0.1.0"
description = "Agent system for AI automation"
requires-python = ">=3.10"
dependencies = [
    "alibabacloud_iqs20241111>=1.9.0",
    "httpx",
    "beautifulsoup4>=4.12",
    "markdownify",
    "openai",
    "tree-sitter",
    "tree-sitter-bash",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio"]
server = ["fastapi", "uvicorn", "sse-starlette"]

[project.scripts]
serve = "uvicorn:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
engine = ["prompts/templates/*.md"]
